<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Team 51</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="team.js"></script>
</head>
<body class="main-bg">
  <div class="container">
    <h1 class="title">🎉 Pick Your Dream Team 🎉</h1>
    <p class="subtitle">Select your players and build the best fantasy team 🏏</p>

    <div id="teamSelection" class="grid-container">
      <!-- Player cards will be added via JS -->
    </div>

    <div class="team-preview">
      <h3>Your Selected Team</h3>
      <ul id="selectedTeam"></ul>
      <p id="teamCount">Players Selected: 0</p>
    </div>

    <div class="buttons">
      <button id="submitBtn" disabled>Submit Team</button>
      <button id="resetBtn">Reset</button>
    </div>

    <footer>
      <p>Powered by <span class="highlight">Team Baba XI</span></p>
    </footer>
  </div>
</body>
</html>
